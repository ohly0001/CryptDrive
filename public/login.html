<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <meta name="author" content="Robert Ohly">
        <title>CryptDrive Authentication</title>
        <script src="js/login.js" defer></script>
        <link rel="stylesheet" href="/css/site.css">
        <link rel="stylesheet" href="/css/auth.css">
        <script src="https://kit.fontawesome.com/0f23db6f2c.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <h1>CryptDrive Login</h1>
        <form id="form">
            <fieldset>
                <legend>Login</legend>
                <label for="email"><i class="fa-solid fa-id-card"></i> Username or Email</label><br>
                <input id="email" type="email" title="username is case-sensitive, email is case-insensitive" placeholder="jsmith@email.com" autocomplete="true" required><br><br>
                <label for="password"><i class="fa-solid fa-key"></i> Password</label><br>
                <input id="password" autocomplete="off" type="password" required>
                <button type="button" id="passwordPeek" title="Reveal Pasword"><i class="fa-solid fa-eye"></i></button><br><br>
                <input id="login" type="submit" value="Login"><br><br>
                <a href="./passwordResetCode.html">Forgot Password?</a>
            </fieldset>
            <fieldset>
                <legend>Other</legend>
                <button onclick="document.location.href='./register.html'">Register</button>
            </fieldset>
        </form>
    </body>
</html>
